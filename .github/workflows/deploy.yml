name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Стаж на странице резюме вшивается в HTML/бандл на этапе сборки как
  # месяц сборки (src/shared/lib/now.ts, __BUILD_MONTH__). Без пересборки
  # это число молча устаревает, поэтому раз в месяц пересобираем и
  # передеплоиваем сайт даже без изменений в коде.
  schedule:
    - cron: '10 0 1 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:size
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
